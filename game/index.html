<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Signal: Kestrel-9</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06090c; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The game renders at 1280x720 and scales to fit the window, keeping
     its aspect ratio: no stretching, no scrollbars. */
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    background: #141a20;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Dead Signal: Kestrel-9, a top-down wave-survival shooter. Move with WASD, aim with the mouse, shoot by clicking, press E to use things."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
